name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Biome CI
        run: bunx @biomejs/biome ci .

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - file-metadata
          - header-parser
          - timestamp
          - url-shortener
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Test with coverage
        working-directory: ${{ matrix.service }}
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.0
        with:
          files: ${{ matrix.service }}/coverage/lcov.info
          flags: ${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # exercise-tracker is the only stateful service: it gets a Mongo 7 container.
  test-exercise-tracker:
    name: Test (exercise-tracker + Mongo 7)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/exercise-tracker-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Test with coverage
        working-directory: exercise-tracker
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.0
        with:
          files: exercise-tracker/coverage/lcov.info
          flags: exercise-tracker
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  openapi-lint:
    name: OpenAPI (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Generate OpenAPI specs
        run: |
          for s in exercise-tracker file-metadata header-parser timestamp url-shortener; do
            (cd "$s" && node gen-openapi.js)
          done
      - name: Lint specs with Spectral
        run: bunx @stoplight/spectral-cli lint -r .spectral.yaml "*/openapi.json"
