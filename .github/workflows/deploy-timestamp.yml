name: Deploy Timestamp Worker

# Gated proof-of-concept deploy for the stateless Timestamp service to
# Cloudflare Workers. Does nothing until CLOUDFLARE_API_TOKEN is set as a
# repo secret, so it never fails on forks or before an account exists.
on:
  push:
    branches: [main]
    paths:
      - "timestamp/worker.js"
      - "timestamp/wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CF_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: timestamp
