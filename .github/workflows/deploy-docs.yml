name: Deploy API Docs to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Generate Exercise Tracker Docs
        working-directory: ./exercise-tracker
        run: |
          bun install
          bun run swagger
      
      - name: Generate File Metadata Docs
        working-directory: ./file-metadata
        run: |
          bun install
          bun run swagger
      
      - name: Generate Header Parser Docs
        working-directory: ./header-parser
        run: |
          bun install
          bun run swagger
      
      - name: Generate Timestamp Docs
        working-directory: ./timestamp
        run: |
          bun install
          bun run swagger
      
      - name: Generate URL Shortener Docs
        working-directory: ./url-shortener
        run: |
          bun install
          bun run swagger
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
