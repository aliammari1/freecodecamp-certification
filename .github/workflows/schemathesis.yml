name: Schemathesis Contract Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Stateless services: boot, then fuzz /api-docs.json.
  stateless:
    name: Fuzz ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - file-metadata
          - header-parser
          - timestamp
          - url-shortener
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Boot service
        working-directory: ${{ matrix.service }}
        env:
          PORT: 3000
        run: |
          bun run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api-docs.json && break || sleep 1
          done
      - name: Run Schemathesis
        run: |
          pip install schemathesis
          schemathesis run http://localhost:3000/api-docs.json \
            --checks all --max-examples 25 --hypothesis-seed 0

  # exercise-tracker needs a database.
  exercise-tracker:
    name: Fuzz exercise-tracker (+ Mongo 7)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Boot service
        working-directory: exercise-tracker
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/exercise-tracker-test
        run: |
          bun run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api-docs.json && break || sleep 1
          done
      - name: Run Schemathesis
        run: |
          pip install schemathesis
          schemathesis run http://localhost:3000/api-docs.json \
            --checks all --max-examples 25 --hypothesis-seed 0
